<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Vivien Tan, Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a1519"/><stop offset="1" stop-color="#190809"/></linearGradient>
    <radialGradient id="glow" cx=".8" cy=".1" r=".7"><stop offset="0" stop-color="#8e3045" stop-opacity=".9"/><stop offset="1" stop-color="#8e3045" stop-opacity="0"/></radialGradient>
    <pattern id="stripes" width="62" height="62" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><rect width="2" height="62" fill="#ff7b96" opacity=".09"/></pattern>
  </defs>
  <style>
    .shard{fill:#ff7b96;opacity:.08;animation:drift 14s linear infinite}
    @keyframes drift{from{transform:translateX(-600px) skewX(-12deg)}to{transform:translateX(1300px) skewX(-12deg)}}
    .slam{animation:slam .9s cubic-bezier(.2,1.4,.4,1) both}
    @keyframes slam{from{opacity:0;transform:translateX(-90px)}}
    .cat{font:700 26px 'Courier New',monospace;fill:#ff7b96}
    .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:br 3.4s ease-in-out infinite}
    @keyframes br{50%{transform:scale(1.03,1.08)}}
    .z{font:700 24px 'Courier New',monospace;fill:#ff7b96;opacity:0;animation:zz 3.6s ease-out infinite}
    @keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(20px,-36px)}}
    .arrow{animation:nudge .7s ease-in-out infinite alternate}
    @keyframes nudge{to{transform:translateX(10px)}}
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect width="1200" height="320" fill="url(#stripes)"/>
  <rect class="shard" x="0" y="30" width="520" height="70"/>
  <rect class="shard" x="0" y="150" width="400" height="30" style="animation-duration:20s;animation-delay:-6s"/>
  <rect class="shard" x="0" y="230" width="520" height="70" style="animation-duration:17s;animation-delay:-11s"/>

  <g transform="skewX(-12)">
    <g class="slam">
      <text x="110" y="170" font-family="Impact,'Arial Black',sans-serif" font-size="112" letter-spacing="3"><tspan fill="none" stroke="#ff7b96" stroke-width="2.5">VIVIEN </tspan><tspan fill="#ffe9ee">TAN</tspan></text>
    </g>
    <g class="slam" style="animation-delay:.2s">
      <rect x="110" y="200" width="330" height="50" fill="#ffe9ee"/>
      <rect x="100" y="200" width="10" height="50" fill="#ff7b96"/>
      <rect x="448" y="204" width="330" height="50" fill="#8e3045"/>
      <text x="132" y="236" font-family="Impact,'Arial Black',sans-serif" font-size="28" letter-spacing="1.5" fill="#3a1519">Software Engineer</text>
    </g>
  </g>
  <polygon class="arrow" points="470,213 470,239 492,226" fill="#ff7b96"/>

  <g transform="translate(900 105)">
    <g class="breathe">
      <text class="cat" xml:space="preserve" x="45" y="0">/\_/\</text>
      <text class="cat" xml:space="preserve" x="30" y="30">( -.- )</text>
      <text class="cat" xml:space="preserve" x="15" y="60">/       \_</text>
      <text class="cat" xml:space="preserve" x="0" y="90">(  _____   )</text>
      <text class="cat" xml:space="preserve" x="15" y="120">`-'     `-'</text>
    </g>
    <text class="z" x="125" y="10">z</text>
    <text class="z" x="125" y="10" style="animation-delay:1.2s">Z</text>
    <text class="z" x="125" y="10" style="animation-delay:2.4s">z</text>
  </g>

  <rect y="314" width="1200" height="6" fill="#ff7b96"/>
</svg>